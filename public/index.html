<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>포인트 상점</title>
<style>
  :root {
    --paper:#f4f0e8; --card:#fbf9f4; --ink:#23201c; --mute:#7a7467;
    --line:#d9d3c5; --accent:#b8452a; --ok:#3d6b3a;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body {
    background:var(--paper); color:var(--ink);
    font:15px/1.6 "Pretendard","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  }
  header {
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    padding:18px 28px; border-bottom:1px solid var(--line);
  }
  .brand { font-size:19px; font-weight:700; letter-spacing:.02em; }
  .brand small { font-weight:400; color:var(--mute); font-size:12px; margin-left:8px; }
  #hdrRight { font-size:13px; color:var(--mute); display:flex; gap:14px; align-items:baseline; }
  main { max-width:1080px; margin:0 auto; padding:28px; }
  h2 { font-size:15px; margin:0 0 12px; font-weight:700; }
  .sec { margin-bottom:34px; }
  .mute { color:var(--mute); }
  .num { font-variant-numeric:tabular-nums; }

  input[type=text], input[type=password], input[type=number], select {
    font:inherit; color:inherit; background:#fff; padding:8px 10px;
    border:1px solid var(--line); border-radius:3px; width:100%;
  }
  input:focus, select:focus { outline:2px solid var(--ink); outline-offset:-1px; }
  .btn {
    font:inherit; cursor:pointer; padding:8px 16px; border-radius:3px;
    background:var(--ink); color:var(--paper); border:1px solid var(--ink);
  }
  .btn:hover { background:#000; }
  .btn.line { background:transparent; color:var(--ink); border-color:var(--ink); }
  .btn.line:hover { background:var(--ink); color:var(--paper); }
  .btn.sm { padding:4px 10px; font-size:13px; }
  .btn.danger { background:transparent; color:var(--accent); border-color:var(--accent); }
  .btn.danger:hover { background:var(--accent); color:#fff; }
  .btn:disabled { opacity:.35; cursor:not-allowed; }
  .linkbtn { background:none; border:0; padding:0; font:inherit; color:var(--mute); cursor:pointer; text-decoration:underline; }
  .linkbtn:hover { color:var(--ink); }

  .flash { padding:10px 14px; border-left:3px solid var(--accent); background:var(--card); margin-bottom:22px; font-size:14px; }
  .flash.ok { border-color:var(--ok); }

  .login { max-width:340px; padding-top:40px; }
  .login h1 { font-size:24px; margin:0 0 6px; line-height:1.3; }
  .login p { margin:0 0 22px; color:var(--mute); }
  .login label { display:block; font-size:13px; color:var(--mute); margin:12px 0 4px; }
  .login .btn { margin-top:20px; width:100%; padding:10px; }

  .top { display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:26px; border-bottom:1px solid var(--line); padding-bottom:18px; }
  .top .who { font-size:13px; color:var(--mute); }
  .top .name { font-size:22px; font-weight:700; }
  .top .pts { text-align:right; }
  .top .pts b { display:block; font-size:30px; line-height:1.1; letter-spacing:-.01em; }
  .shop { display:grid; grid-template-columns:1fr 300px; gap:36px; align-items:start; }
  @media (max-width:820px){ .shop { grid-template-columns:1fr; } main{padding:18px;} header{padding:14px 18px;} }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:16px; }
  .prod { background:var(--card); border:1px solid var(--line); border-radius:3px; display:flex; flex-direction:column; }
  .thumb {
    aspect-ratio:4/3; display:flex; align-items:center; justify-content:center; overflow:hidden;
    background:repeating-linear-gradient(135deg,#efe9db 0 10px,#f4efe3 10px 20px);
    border-bottom:1px solid var(--line);
    font:700 40px Georgia,"Batang","Noto Serif KR",serif; color:#b9b09b;
  }
  .thumb img { width:100%; height:100%; object-fit:cover; }
  .pbody { padding:12px 14px 14px; display:flex; flex-direction:column; flex:1; }
  .pname { font-weight:700; }
  .pdesc { font-size:13px; color:var(--mute); margin:2px 0 10px; flex:1; }
  .pfoot { display:flex; justify-content:space-between; align-items:center; }
  .price { font-weight:700; }
  .price i { font-style:normal; font-weight:400; color:var(--mute); font-size:13px; margin-left:2px; }
  .stockline { font-size:12px; color:var(--mute); margin-bottom:6px; }
  .prod.out { opacity:.55; }
  .side { position:sticky; top:16px; background:var(--card); border:1px solid var(--line); border-radius:3px; padding:16px; }
  .cl { display:flex; justify-content:space-between; gap:8px; padding:8px 0; border-bottom:1px dotted var(--line); font-size:14px; }
  .cl .q { display:flex; gap:6px; align-items:center; white-space:nowrap; }
  .cl .q button { width:22px; height:22px; padding:0; line-height:1; background:#fff; border:1px solid var(--line); border-radius:3px; cursor:pointer; font:inherit; }
  .sumrow { display:flex; justify-content:space-between; padding:3px 0; }
  .sumrow.big { font-weight:700; font-size:17px; margin-top:8px; }
  .warn { color:var(--accent); font-size:13px; margin:8px 0 0; }

  .tw { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:left; font-weight:600; font-size:12px; color:var(--mute); padding:8px 8px; border-bottom:1px solid var(--ink); white-space:nowrap; }
  td { padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
  td.r, th.r { text-align:right; }
  .plus { color:var(--ok); } .minus { color:var(--accent); }
  .adj { display:flex; gap:4px; align-items:center; }
  .adj input { width:90px; padding:5px 8px; }
  code.cd { background:#fff; border:1px solid var(--line); padding:1px 6px; border-radius:3px; }

  .tabs { display:flex; gap:22px; border-bottom:1px solid var(--line); margin-bottom:24px; }
  .tab { background:none; border:0; font:inherit; padding:8px 0; cursor:pointer; color:var(--mute); border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tab.on { color:var(--ink); font-weight:700; border-color:var(--ink); }
  .addform { display:grid; grid-template-columns:1.4fr 1fr 1fr auto; gap:8px; align-items:end; margin-bottom:26px; }
  .addform label { font-size:12px; color:var(--mute); display:block; margin-bottom:3px; }
  @media (max-width:700px){ .addform { grid-template-columns:1fr 1fr; } }
  .row2 { display:flex; gap:8px; flex-wrap:wrap; }
  .empty { color:var(--mute); padding:10px 0; }
</style>
</head>
<body>

<header>
  <div class="brand"><span id="shopName">상점</span><small id="ver"></small></div>
  <div id="hdrRight"></div>
</header>
<main id="app"></main>

<script>
const IDLE_SEC = 120;   // 회원이 아무것도 안 하면 자동 로그아웃(초)

let view = 'login';     // login | shop | adminLogin | admin
let me = null, myHistory = [], products = [];
let cart = {}, tab = 'members', flash = null, idleTimer = null, histFilter = 'all';
let adm = null;         // 관리자 화면 데이터
let busy = false;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n).toLocaleString('ko-KR');
const prod = id => products.find(p => p.id === id);
const tok = { get m(){ return sessionStorage.getItem('ps.m'); }, set m(v){ v ? sessionStorage.setItem('ps.m', v) : sessionStorage.removeItem('ps.m'); },
              get a(){ return sessionStorage.getItem('ps.a'); }, set a(v){ v ? sessionStorage.setItem('ps.a', v) : sessionStorage.removeItem('ps.a'); } };

async function api(path, opt = {}, role) {
  const headers = { 'Content-Type':'application/json' };
  const t = role === 'admin' ? tok.a : role === 'member' ? tok.m : null;
  if (t) headers.Authorization = 'Bearer ' + t;
  let r;
  try { r = await fetch(path, { method:opt.method || 'GET', headers, body:opt.body ? JSON.stringify(opt.body) : undefined }); }
  catch (e) { throw new Error('서버에 연결할 수 없어요. 인터넷 연결을 확인해 주세요.'); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) {
    if (r.status === 401 && role) { sessionExpired(role); }
    throw new Error(d.error || '오류가 발생했어요.');
  }
  return d;
}
function sessionExpired(role) {
  if (role === 'member' && view === 'shop') { tok.m = null; me = null; flash = { text:'로그인이 만료되었어요. 다시 들어와 주세요.' }; view = 'login'; render(); }
  if (role === 'admin' && view === 'admin') { tok.a = null; flash = { text:'관리자 로그인이 만료되었어요.' }; view = 'adminLogin'; render(); }
}
const fail = e => { flash = { text:e.message }; render(); };
const ok = text => { flash = { ok:true, text }; };
function go(v) { view = v; cart = {}; render(); }

/* ---------- 자동 로그아웃 ---------- */
function resetIdle() {
  clearTimeout(idleTimer);
  if (view === 'shop') idleTimer = setTimeout(() => { logout('오랫동안 사용하지 않아 로그아웃되었습니다.'); }, IDLE_SEC * 1000);
}
['click','keydown','touchstart','mousemove'].forEach(e => document.addEventListener(e, resetIdle));
setInterval(() => { if (view === 'shop' && !busy) refreshMe(true); }, 20000);

/* ============================================================
   회원 화면
   ============================================================ */
function vLogin() {
  return `
  <div class="login">
    <h1>이름을 입력하고<br>들어오세요</h1>
    <p>보유 포인트로 상품을 살 수 있어요.</p>
    <form onsubmit="doLogin(event)">
      <label>이름</label>
      <input type="text" id="lname" data-focus autocomplete="off">
      <label>확인 코드 <span class="mute">(관리자에게 받은 코드)</span></label>
      <input type="password" id="lcode" autocomplete="off">
      <button class="btn">입장</button>
    </form>
  </div>`;
}
async function doLogin(e) {
  e.preventDefault();
  try {
    const d = await api('/api/login', { method:'POST', body:{ name:$('lname').value, code:$('lcode').value } });
    tok.m = d.token;
    await refreshMe(); go('shop'); resetIdle();
  } catch (err) { fail(err); }
}
async function refreshMe(silent) {
  try {
    const d = await api('/api/me', {}, 'member');
    me = d.member; myHistory = d.history; products = d.products;
    if (view === 'shop') {
      // 장바구니 수량이 재고보다 많아졌으면 조정
      for (const id of Object.keys(cart)) { const p = prod(id); if (!p) delete cart[id]; else if (p.remain != null && cart[id] > p.remain) { if (p.remain <= 0) delete cart[id]; else cart[id] = p.remain; } }
      if (!silent) render(); else if (document.activeElement === document.body) render();
    }
  } catch (err) { if (!silent) throw err; }
}
async function logout(msg) {
  try { await api('/api/logout', { method:'POST' }, 'member'); } catch (e) {}
  tok.m = null; me = null; clearTimeout(idleTimer);
  if (msg) flash = { text:msg };
  go('login');
}

function vShop() {
  const cards = products.map(p => {
    const out = p.remain != null && p.remain <= 0;
    return `
    <div class="prod ${out ? 'out' : ''}">
      <div class="thumb">${p.img ? `<img src="${esc(p.img)}" alt="">` : esc(p.name.charAt(0))}</div>
      <div class="pbody">
        <div class="pname">${esc(p.name)}</div>
        <div class="pdesc">${esc(p.desc)}</div>
        ${p.remain != null ? `<div class="stockline">${out ? '품절' : '남은 수량 ' + p.remain + '개'}</div>` : ''}
        <div class="pfoot">
          <span class="price num">${fmt(p.price)}<i>P</i></span>
          <button class="btn line sm" onclick="addCart('${p.id}')" ${out ? 'disabled' : ''}>담기</button>
        </div>
      </div>
    </div>`;
  }).join('');
  return `
  <div class="top">
    <div><div class="who">안녕하세요</div><div class="name">${esc(me.name)}</div></div>
    <div class="pts"><span class="who">보유 포인트</span><b class="num">${fmt(me.points)} P</b></div>
  </div>
  ${flashHtml()}
  <div class="shop">
    <div>
      <div class="sec"><h2>상품</h2><div class="grid">${cards || '<div class="empty">등록된 상품이 없습니다.</div>'}</div></div>
      <div class="sec"><h2>내 구매 내역</h2>${myHistory.length ? `<div class="tw"><table>
        <tr><th>날짜</th><th>내용</th><th class="r">사용</th><th class="r">잔액</th></tr>
        ${myHistory.map(h => `<tr><td class="mute">${esc(h.t)}</td><td>${esc(h.detail)}</td><td class="r num minus">${fmt(h.amount)}</td><td class="r num">${fmt(h.balance)}</td></tr>`).join('')}
      </table></div>` : '<div class="empty">아직 구매한 내역이 없어요.</div>'}</div>
    </div>
    <div class="side">${cartHtml()}</div>
  </div>`;
}
function cartTotal() { return Object.entries(cart).reduce((s,[id,q]) => s + (prod(id)?.price || 0) * q, 0); }
function cartHtml() {
  const ids = Object.keys(cart).filter(prod);
  if (!ids.length) return '<h2>장바구니</h2><div class="empty">비어 있어요.</div>';
  const total = cartTotal(), enough = me.points >= total;
  return `<h2>장바구니</h2>
  ${ids.map(id => { const p = prod(id); return `
    <div class="cl"><span>${esc(p.name)}</span>
      <span class="q"><button onclick="qty('${id}',-1)">−</button><span class="num">${cart[id]}</span><button onclick="qty('${id}',1)">＋</button>
      <span class="num" style="min-width:56px;text-align:right">${fmt(p.price * cart[id])}</span></span></div>`; }).join('')}
  <div style="margin-top:12px">
    <div class="sumrow"><span class="mute">보유</span><span class="num">${fmt(me.points)} P</span></div>
    <div class="sumrow"><span class="mute">합계</span><span class="num">− ${fmt(total)} P</span></div>
    <div class="sumrow big"><span>남는 포인트</span><span class="num">${fmt(me.points - total)} P</span></div>
  </div>
  ${enough ? '' : `<p class="warn">포인트가 ${fmt(total - me.points)} P 모자라요.</p>`}
  <div class="row2" style="margin-top:14px">
    <button class="btn" onclick="checkout()" ${enough ? '' : 'disabled'} style="flex:1">구매하기</button>
    <button class="btn line" onclick="cart={};render()">비우기</button>
  </div>`;
}
function addCart(id) {
  const p = prod(id); if (!p) return;
  if (p.remain != null && (cart[id] || 0) + 1 > p.remain) { flash = { text:'남은 수량이 부족해요.' }; return render(); }
  cart[id] = (cart[id] || 0) + 1; render();
}
function qty(id, d) {
  const p = prod(id), n = (cart[id] || 0) + d;
  if (n <= 0) delete cart[id];
  else if (p.remain != null && n > p.remain) { flash = { text:'남은 수량이 부족해요.' }; return render(); }
  else cart[id] = n;
  render();
}
async function checkout() {
  const ids = Object.keys(cart).filter(prod);
  if (!ids.length || busy) return;
  const detail = ids.map(id => `${prod(id).name} ×${cart[id]}`).join(', ');
  if (!confirm(`${fmt(cartTotal())} P를 사용해 구매할까요?\n${detail}`)) return;
  busy = true;
  try {
    const d = await api('/api/buy', { method:'POST', body:{ items:cart } }, 'member');
    me = d.member; products = d.products; cart = {};
    await refreshMe(true);
    ok(`구매 완료 — ${d.detail} (남은 포인트 ${fmt(me.points)} P)`);
  } catch (err) { flash = { text:err.message }; await refreshMe(true).catch(()=>{}); }
  busy = false; render();
}

/* ============================================================
   관리자 화면
   ============================================================ */
function vAdminLogin() {
  return `
  <div class="login">
    <h1>관리자</h1>
    <p>비밀번호를 입력해 주세요.</p>
    <form onsubmit="doAdminLogin(event)">
      <input type="password" id="apin" data-focus autocomplete="off">
      <button class="btn">들어가기</button>
    </form>
  </div>`;
}
async function doAdminLogin(e) {
  e.preventDefault();
  try {
    const d = await api('/api/admin/login', { method:'POST', body:{ pin:$('apin').value } });
    tok.a = d.token; tab = 'members';
    await loadAdmin(); go('admin');
  } catch (err) { fail(err); }
}
async function loadAdmin() { adm = await api('/api/admin/state', {}, 'admin'); }
async function adminDo(path, opt, msg) {
  try { await api(path, opt, 'admin'); await loadAdmin(); if (msg) ok(msg); }
  catch (err) { flash = { text:err.message }; }
  render();
}
function adminLogout() { tok.a = null; adm = null; go('login'); }

function vAdmin() {
  const tabs = [['members','회원·포인트'],['history','전체 내역'],['stock','상품 현황'],['data','데이터']];
  const body = { members:aMembers, history:aHistory, stock:aStock, data:aData }[tab]();
  return `
  <div class="tabs">${tabs.map(([k,l]) => `<button class="tab ${tab===k?'on':''}" onclick="tab='${k}';render()">${l}</button>`).join('')}</div>
  ${flashHtml()}${body}`;
}
function aMembers() {
  const list = adm.members;
  return `
  <div class="sec">
    <h2>회원 추가</h2>
    <form class="addform" onsubmit="addMember(event)">
      <div><label>이름</label><input type="text" id="nn" autocomplete="off"></div>
      <div><label>시작 포인트</label><input type="number" id="np" min="0" placeholder="0"></div>
      <div><label>확인 코드 (비우면 자동 생성)</label><input type="text" id="nc" autocomplete="off"></div>
      <button class="btn">추가</button>
    </form>
  </div>
  <div class="sec">
    <h2>회원 ${list.length}명</h2>
    ${list.length ? `<div class="tw"><table>
      <tr><th>이름</th><th class="r">포인트</th><th>확인 코드</th><th>포인트 조정</th><th></th></tr>
      ${list.map(m => `<tr>
        <td>${esc(m.name)}</td>
        <td class="r num"><b>${fmt(m.points)}</b></td>
        <td><code class="cd">${esc(m.code)}</code> <button class="linkbtn" onclick="setCode('${m.id}')">변경</button></td>
        <td><div class="adj"><input type="number" id="pt_${m.id}" min="0" placeholder="숫자">
          <button class="btn line sm" onclick="adj('${m.id}','add')">지급</button>
          <button class="btn line sm" onclick="adj('${m.id}','sub')">차감</button>
          <button class="btn line sm" onclick="adj('${m.id}','set')">설정</button></div></td>
        <td class="r"><button class="btn danger sm" onclick="delMember('${m.id}','${esc(m.name)}')">삭제</button></td>
      </tr>`).join('')}</table></div>` : '<div class="empty">아직 회원이 없습니다.</div>'}
  </div>`;
}
async function addMember(e) {
  e.preventDefault();
  const name = $('nn').value.trim();
  try {
    const d = await api('/api/admin/members', { method:'POST', body:{ name, points:$('np').value, code:$('nc').value } }, 'admin');
    await loadAdmin(); ok(`${name} 회원을 추가했습니다. 확인 코드: ${d.member.code}`);
  } catch (err) { flash = { text:err.message }; }
  render();
}
function adj(id, mode) {
  const v = $('pt_' + id).value;
  adminDo(`/api/admin/members/${id}/points`, { method:'POST', body:{ mode, value:v } }, '반영했습니다.');
}
function setCode(id) {
  const c = prompt('새 확인 코드를 입력하세요. (4자 이상)');
  if (c === null) return;
  adminDo(`/api/admin/members/${id}/code`, { method:'POST', body:{ code:c } }, '확인 코드를 바꿨습니다.');
}
function delMember(id, name) {
  if (!confirm(`${name} 회원을 삭제할까요? (내역은 남습니다)`)) return;
  adminDo(`/api/admin/members/${id}`, { method:'DELETE' }, '삭제했습니다.');
}
function aHistory() {
  const names = [...new Set(adm.history.map(h => h.name))];
  const list = histFilter === 'all' ? adm.history : adm.history.filter(h => h.name === histFilter);
  return `
  <div class="sec">
    <div class="row2" style="max-width:260px;margin-bottom:14px">
      <select onchange="histFilter=this.value;render()">
        <option value="all">전체 회원</option>
        ${names.map(n => `<option ${n===histFilter?'selected':''} value="${esc(n)}">${esc(n)}</option>`).join('')}
      </select>
    </div>
    ${list.length ? `<div class="tw"><table>
      <tr><th>시간</th><th>회원</th><th>구분</th><th class="r">포인트</th><th>내용</th><th class="r">잔액</th></tr>
      ${list.map(h => `<tr><td class="mute">${esc(h.t)}</td><td>${esc(h.name)}</td><td>${esc(h.type)}</td>
        <td class="r num ${h.amount>=0?'plus':'minus'}">${h.amount>=0?'+':''}${fmt(h.amount)}</td>
        <td>${esc(h.detail)}</td><td class="r num">${fmt(h.balance)}</td></tr>`).join('')}
    </table></div>` : '<div class="empty">내역이 없습니다.</div>'}
  </div>`;
}
function aStock() {
  return `<div class="sec"><div class="tw"><table>
    <tr><th>상품</th><th class="r">가격</th><th class="r">판매</th><th class="r">남은 수량</th></tr>
    ${adm.products.map(p => `<tr><td>${esc(p.name)}</td><td class="r num">${fmt(p.price)} P</td>
      <td class="r num">${p.sold}</td><td class="r num">${p.remain == null ? '무제한' : p.remain}</td></tr>`).join('')}
  </table></div>
  <p class="mute" style="font-size:13px">상품은 서버의 products.js 파일에서 추가·수정합니다.</p></div>`;
}
function aData() {
  return `<div class="sec">
    <h2>백업</h2>
    <p class="mute" style="margin-top:0;font-size:13px">무료 호스팅은 서버가 재시작되면 데이터가 지워질 수 있어요. 주기적으로 내보내기로 백업해 두세요.</p>
    <div class="row2" style="margin-bottom:26px">
      <button class="btn line" onclick="exportData()">내보내기</button>
      <button class="btn line" onclick="$('imp').click()">가져오기</button>
      <input type="file" id="imp" accept=".json" style="display:none" onchange="importData(event)">
    </div>
    <h2>초기화</h2>
    <p class="mute" style="margin-top:0">회원, 포인트, 내역, 판매 수량이 모두 지워집니다.</p>
    <button class="btn danger" onclick="resetAll()">전체 초기화</button>
  </div>`;
}
async function exportData() {
  try {
    const d = await api('/api/admin/export', {}, 'admin');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(d, null, 2)], { type:'application/json' }));
    a.download = 'point-shop-backup.json'; a.click(); URL.revokeObjectURL(a.href);
  } catch (err) { fail(err); }
}
function importData(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    let d; try { d = JSON.parse(r.result); } catch (err) { flash = { text:'올바른 백업 파일이 아닙니다.' }; return render(); }
    if (!confirm('현재 데이터를 덮어씁니다. 계속할까요?')) return;
    adminDo('/api/admin/import', { method:'POST', body:d }, '가져왔습니다.');
  };
  r.readAsText(f); e.target.value = '';
}
function resetAll() {
  if (!confirm('모든 데이터를 삭제합니다. 정말 초기화할까요?')) return;
  adminDo('/api/admin/reset', { method:'POST' }, '초기화했습니다.');
}

/* ============================================================
   공통
   ============================================================ */
function flashHtml() { return flash ? `<div class="flash ${flash.ok ? 'ok' : ''}">${esc(flash.text)}</div>` : ''; }

function render() {
  if (view === 'shop' && !me) view = 'login';
  if (view === 'admin' && !adm) view = 'adminLogin';
  $('hdrRight').innerHTML =
    view === 'shop'       ? `<button class="linkbtn" onclick="logout()">로그아웃</button>` :
    view === 'admin'      ? `<span>관리자</span><button class="linkbtn" onclick="adminLogout()">나가기</button>` :
    view === 'adminLogin' ? `<button class="linkbtn" onclick="go('login')">돌아가기</button>` :
                            `<button class="linkbtn" onclick="go('adminLogin')">관리자</button>`;
  const html = { login:vLogin, shop:vShop, adminLogin:vAdminLogin, admin:vAdmin }[view]();
  $('app').innerHTML = (view === 'login' || view === 'adminLogin' ? flashHtml() : '') + html;
  flash = null;
  const f = document.querySelector('[data-focus]'); if (f) f.focus();
}

(async function init() {
  try {
    const info = await api('/api/info');
    $('shopName').textContent = info.name; $('ver').textContent = 'v' + info.version; document.title = info.name;
  } catch (e) {}
  if (tok.m) { try { await refreshMe(true); view = 'shop'; resetIdle(); } catch (e) { tok.m = null; } }
  else if (tok.a) { try { await loadAdmin(); view = 'admin'; } catch (e) { tok.a = null; } }
  render();
})();
</script>
</body>
</html>
